{% set name = "price-parser" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c11a88b64cc0a42b3f8f384adb4cadd1106df214c3a47c3fa314899cf3a609f7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - attrs >=17.3.0

test:
  imports:
    - price_parser
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/scrapinghub/price-parser
  summary: Extract price and currency from a raw string
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - muyajil
